[package]
name = "scrabble-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scrabble-game = { path = "../scrabble-game" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "4b826accaf59ff8e72bc7903f2384669199c1d8d" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
url = "2.5.8"

ring = "0.17.14"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "io-util",
  "net",
  "time",
] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["io-util", "net", "process", "time"] }
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed"] }
