[package]
name = "scrabble-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scrabble-game = { path = "../scrabble-game" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "5cfd000d276ea488415f6a9c0d8e9021dc6d0f77" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
url = "2.5.8"

ring = "0.17.14"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "io-util",
  "net",
  "time",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["io-util", "net", "process", "time"] }
wtransport = { version = "0.7.2", default-features = false, features = ["ring", "self-signed"] }
