[package]
name = "scrabble-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
scrabble-game = { path = "../scrabble-game" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "043867333bbfd880d4ef3484d57fd7199d3b6f2b" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
url = "2.5.8"

ring = "0.17.14"
base64 = "0.23.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "io-util",
  "net",
  "time",
] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
tower = { version = "0.5.3", default-features = false, features = ["limit"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["io-util", "net", "process", "time"] }
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "self-signed"] }
