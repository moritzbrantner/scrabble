services:
  server:
    build: .
    image: scrabble-server:${DEPLOY_VERSION:-local}
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SCRABBLE_MODE: production
      SCRABBLE_PORT: "4433"
      SCRABBLE_STATUS_PORT: "8080"
      SCRABBLE_API_PORT: "8081"
      SCRABBLE_BOARD_ORIGIN: ${DEPLOY_BOARD_ORIGIN:-https://moritzbrantner.github.io}
      SCRABBLE_CERT_PEM: /tls/cert.pem
      SCRABBLE_KEY_PEM: /tls/key.pem
      SCRABBLE_SEED_FILE: /state/seed
      SCRABBLE_RECOVERY_DIR: /state/recovery
      SCRABBLE_ROUTE_PREFIX: /game
      SCRABBLE_MATCH_IDS: ""
      SCRABBLE_MAX_MATCHES: "16"
      SCRABBLE_RECONNECT_GRACE_TICKS: "72000"
      SCRABBLE_DRAIN_GRACE_MS: "500"
      SCRABBLE_DICTIONARY_FILE: /content/words.txt
      SCRABBLE_DICTIONARY_NAME: ${DEPLOY_DICTIONARY_NAME:?Set an explicit dictionary identity}
      SCRABBLE_DICTIONARY_REVISION: ${DEPLOY_DICTIONARY_REVISION:?Set an explicit dictionary revision}
    ports:
      - "${DEPLOY_QUIC_PORT:-443}:4433/udp"
    volumes:
      - ${DEPLOY_TLS_DIRECTORY:?Set the host TLS directory}:/tls:ro
      - ${DEPLOY_STATE_DIRECTORY:?Set durable host state directory}:/state
      - ${DEPLOY_CONTENT_DIRECTORY:?Set the host dictionary directory}:/content:ro
    networks: [game]
  gateway:
    profiles: [production]
    image: nginx:stable-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${DEPLOY_HTTPS_PORT:-443}:8443/tcp"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEPLOY_TLS_DIRECTORY:?Set the host TLS directory}:/tls:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=${DEPLOY_UID:-1000},gid=${DEPLOY_GID:-1000}
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=${DEPLOY_UID:-1000},gid=${DEPLOY_GID:-1000}
    networks: [game]
networks:
  game:
