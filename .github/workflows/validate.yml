name: Validate

# Draft PR development uses focused local checks. Run the full gate on every
# push to a ready PR so its result always belongs to the current head; a newer
# push cancels the older run.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: rustup toolchain install
      - run: bun install --frozen-lockfile
      - run: cargo fetch --locked
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
  deployment:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: rustup toolchain install
      - run: bun install --frozen-lockfile
      - run: bun run test:deployment

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["validate", "deployment"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["validate", "deployment"]'
          allow-skipped: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '["validate", "deployment"]' || '[]' }}
