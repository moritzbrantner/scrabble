name: Validate

# Draft PR development uses focused local checks. Run this full gate only on
# initial ready PRs, when a draft becomes ready, or by explicit dispatch on the
# current head after further commits. Do not validate every intermediate push.
# After pushing to a ready PR, manually dispatch on its new head branch or
# return to draft and mark ready again. Never merge using older-head checks.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install
      - run: bun install --frozen-lockfile
      - run: cargo fetch --locked
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
  deployment:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install
      - run: bun install --frozen-lockfile
      - run: bun run test:deployment
