name: Configure roadmap dependencies

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/configure-roadmap-dependencies.yml

permissions:
  contents: read
  issues: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Add native GitHub issue dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          add_dependency() {
            local blocked_repo="$1"
            local blocked_number="$2"
            local blocker_repo="$3"
            local blocker_number="$4"

            local blocker_id
            if [[ "$blocker_repo" == "moritzbrantner/game-server" && "$blocker_number" == "24" ]]; then
              blocker_id="5693404811"
            else
              blocker_id="$(gh api               -H "X-GitHub-Api-Version: 2026-03-10"               "repos/$blocker_repo/issues/$blocker_number"               --jq '.id')"
            fi

            if gh api               -H "X-GitHub-Api-Version: 2026-03-10"               "repos/$blocked_repo/issues/$blocked_number/dependencies/blocked_by?per_page=100"               --jq '.[].id' | grep -Fxq "$blocker_id"; then
              echo "$blocked_repo#$blocked_number already depends on $blocker_repo#$blocker_number"
              return
            fi

            printf '{"issue_id":%s}\n' "$blocker_id" | gh api               --method POST               -H "X-GitHub-Api-Version: 2026-03-10"               "repos/$blocked_repo/issues/$blocked_number/dependencies/blocked_by"               --input - >/dev/null

            echo "$blocked_repo#$blocked_number depends on $blocker_repo#$blocker_number"
            sleep 1
          }

          R="moritzbrantner/scrabble"
          G="moritzbrantner/game-server"

          add_dependency "$R" 2 "$R" 1
          add_dependency "$R" 3 "$R" 2
          add_dependency "$R" 4 "$R" 3
          add_dependency "$R" 5 "$R" 4
          add_dependency "$R" 6 "$R" 5

          add_dependency "$R" 7 "$R" 1
          add_dependency "$R" 7 "$R" 3
          add_dependency "$R" 8 "$R" 1
          add_dependency "$R" 9 "$R" 4
          add_dependency "$R" 9 "$R" 8
          add_dependency "$R" 10 "$R" 9

          add_dependency "$R" 11 "$R" 10
          add_dependency "$R" 11 "$G" 24
          add_dependency "$R" 12 "$R" 7
          add_dependency "$R" 12 "$R" 11
          add_dependency "$R" 13 "$R" 12
          add_dependency "$R" 14 "$R" 8
          add_dependency "$R" 14 "$R" 11

          add_dependency "$R" 15 "$R" 3
          add_dependency "$R" 15 "$R" 12
          add_dependency "$R" 15 "$R" 14
          add_dependency "$R" 16 "$R" 15
          add_dependency "$R" 17 "$R" 5
          add_dependency "$R" 17 "$R" 16
          add_dependency "$R" 18 "$R" 7
          add_dependency "$R" 18 "$R" 8
          add_dependency "$R" 18 "$R" 17
          add_dependency "$R" 19 "$R" 6
          add_dependency "$R" 19 "$R" 15
          add_dependency "$R" 19 "$R" 17
          add_dependency "$R" 20 "$R" 3
          add_dependency "$R" 20 "$R" 16
          add_dependency "$R" 20 "$R" 19

          add_dependency "$R" 21 "$R" 13
          add_dependency "$R" 21 "$R" 18
          add_dependency "$R" 21 "$R" 19
          add_dependency "$R" 21 "$R" 20

          add_dependency "$R" 22 "$R" 19
          add_dependency "$R" 23 "$R" 3
          add_dependency "$R" 23 "$R" 19
          add_dependency "$R" 24 "$R" 5
          add_dependency "$R" 24 "$R" 19
          add_dependency "$R" 25 "$R" 19
          add_dependency "$R" 25 "$R" 22
          add_dependency "$R" 25 "$R" 23
          add_dependency "$R" 25 "$R" 24

          add_dependency "$R" 26 "$R" 8
          add_dependency "$R" 26 "$R" 11
          add_dependency "$R" 26 "$R" 19
          add_dependency "$R" 27 "$R" 9
          add_dependency "$R" 27 "$R" 19
          add_dependency "$R" 27 "$R" 26
          add_dependency "$R" 28 "$R" 19
          add_dependency "$R" 28 "$R" 25
          add_dependency "$R" 29 "$R" 21
          add_dependency "$R" 29 "$R" 26

          add_dependency "$R" 30 "$R" 2
          add_dependency "$R" 30 "$R" 3
          add_dependency "$R" 30 "$R" 6
          add_dependency "$R" 30 "$R" 24

          add_dependency "$R" 31 "$R" 10
          add_dependency "$R" 31 "$R" 11
          add_dependency "$R" 31 "$R" 21
          add_dependency "$R" 31 "$R" 27
          add_dependency "$R" 32 "$R" 25
          add_dependency "$R" 32 "$R" 29
          add_dependency "$R" 32 "$R" 31
          add_dependency "$R" 33 "$R" 25
          add_dependency "$R" 33 "$R" 26
          add_dependency "$R" 33 "$R" 28

          add_dependency "$R" 34 "$R" 27
          add_dependency "$R" 34 "$R" 28
          add_dependency "$R" 34 "$R" 29
          add_dependency "$R" 34 "$R" 30
          add_dependency "$R" 34 "$R" 31
          add_dependency "$R" 34 "$R" 32
          add_dependency "$R" 34 "$R" 33
