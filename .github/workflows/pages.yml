name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@2ec8d067031d4e9d093701f23a00b0ddcaef42d8 # main
    with:
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
