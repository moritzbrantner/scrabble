name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@8592cea8794365d419fd793840c3102c527679c7 # main
    with:
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
