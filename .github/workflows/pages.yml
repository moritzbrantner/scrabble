name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@b3f0eb95962e8f6642e170bf373a33a8bd80ca0f # main
    with:
      bun_version: 1.4.2
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
