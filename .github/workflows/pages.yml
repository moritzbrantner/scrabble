name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@15e2a80f13e16d29e432ab761891b5d520622360 # main
    with:
      bun_version: 1.4.2
      pre_command: rustup toolchain install && cargo fetch --locked && bunx playwright install --with-deps chromium
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
