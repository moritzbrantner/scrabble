name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@3b01b02c90cd295e6a395a15255ae540848bc714 # main
    with:
      bun_version: 1.4.2
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
