name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@fa354ad57d45f3b3bda1d3e172202466b3cbce5f # main
    with:
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
