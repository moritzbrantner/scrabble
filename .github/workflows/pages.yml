name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@3f844af99f28f6324f3c0d41b3a89c45b4182c5a # main
    with:
      bun_version: 1.4.2
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
