name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@c50095269318d374df42a86de08c3bf236f2e01f # main
    with:
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
