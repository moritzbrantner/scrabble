name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@d5717786a8fb6485e1df1f3dcdd8e9c1d2f3fff9 # main
    with:
      build_command: bun scripts/build-pages.ts
      artifact_path: dist
      concurrency_group: pages
