name: Scrabble Provisioning Comparison

# Non-required experiment for #81: identical `bun run check` on the same runner class with
# conventional provisioning, the locked Nix development shell, and a prebuilt digest-pinned
# agent container (.devcontainer/Dockerfile). Opt in when collecting benchmark evidence;
# routine PRs must not trigger this fifteen-sample experiment.
#
# cold: every sample is a fresh runner with no restored Actions caches. The container
#       sample still pulls its image on that fresh runner; building the image is a separate
#       `image` job, skipped when the tag already exists in GHCR.
# warm: one priming job per variant runs the gate and saves its dependency/build caches
#       under this run's key; every sample is then a fresh runner that restores them.
#       The Nix store itself is not cached (no binary cache by design).
on:
  workflow_dispatch:
    inputs:
      cache_state:
        description: "cold or warm"
        required: true
        default: cold
        type: choice
        options: [cold, warm]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/scrabble-agent-env

jobs:
  image:
    name: Prebuilt agent container image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build only when the environment inputs changed
        id: publish
        run: |
          set -euo pipefail
          tag="$(cat .devcontainer/Dockerfile rust-toolchain.toml <(jq -r .packageManager package.json) | sha256sum | cut -c1-16)"
          image="$IMAGE_REPOSITORY:$tag"
          if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            start=$(date +%s)
            docker build -f .devcontainer/Dockerfile -t "$image" .
            docker push "$image"
            echo "| Image | built and pushed in $(( $(date +%s) - start )) s |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Image | reused existing $image |" >> "$GITHUB_STEP_SUMMARY"
          fi
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "ref=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "| Image ref | $IMAGE_REPOSITORY@$digest |" >> "$GITHUB_STEP_SUMMARY"

  prime:
    name: "${{ matrix.variant }} warm cache priming"
    if: inputs.cache_state == 'warm'
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, nix, container]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/provision-sample
        with:
          variant: ${{ matrix.variant }}
          image: ${{ needs.image.outputs.ref }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # The container variant mounts these same host directories.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            ~/.cache/ms-playwright
            target
          key: provisioning-${{ matrix.variant }}-${{ github.run_id }}

  compare:
    name: "${{ matrix.variant }} ${{ inputs.cache_state }} sample ${{ matrix.sample }}"
    needs: [image, prime]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.prime.result == 'success' || needs.prime.result == 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, nix, container]
        sample: [1, 2, 3, 4, 5]
    steps:
      - name: Check out the identical source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore this run's warm caches on a fresh runner
        if: inputs.cache_state == 'warm'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # The container variant mounts these same host directories.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.bun/install/cache
            ~/.cache/ms-playwright
            target
          key: provisioning-${{ matrix.variant }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/provision-sample
        with:
          variant: ${{ matrix.variant }}
          image: ${{ needs.image.outputs.ref }}
      - name: Record independent experimental sample
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
          SAMPLE: ${{ matrix.sample }}
          CACHE_STATE: ${{ inputs.cache_state }}
        run: |
          echo "| Provisioner | Cache state | Sample | Source | Runner image |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | ---: | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| $VARIANT | $CACHE_STATE | $SAMPLE | $GITHUB_SHA | ${ImageOS:-unknown} ${ImageVersion:-unknown} |" >> "$GITHUB_STEP_SUMMARY"
