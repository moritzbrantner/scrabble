# Include inside the existing moenarch.com TLS server block.
location /scrabble-api/ {
    access_log off;
    client_max_body_size 8k;
    limit_req zone=multiplayer_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:18081/;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
}
location = /scrabble-healthz {
    access_log off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18080/healthz;
    add_header Cache-Control "no-store" always;
}
location = /scrabble-readyz {
    access_log off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18080/readyz;
    add_header Cache-Control "no-store" always;
}
